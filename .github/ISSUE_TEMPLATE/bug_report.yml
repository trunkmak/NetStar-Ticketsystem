name: Fehler melden
description: Einen reproduzierbaren Fehler im Ticketsystem beschreiben
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte und Eingaben
      description: Programmstart, Menuepunkte und genaue Eingaben
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Ergebnis
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliche Ausgabe
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: JDK-Version und Betriebssystem
