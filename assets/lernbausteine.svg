<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
<title id="title">Sechs Lernbausteine des NetStar Ticketsystems</title><desc id="desc">Tickets, Collections, Priorität, Rückgängig, Streams und Auswertung mit kurzen Erklärungen.</desc>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="580" rx="24" fill="#f0f5f9"/><text x="42" y="56" font-size="32" fill="#10273d" font-weight="700" >Ein Projekt. Sechs Lernbausteine.</text><text x="42" y="89" font-size="19" fill="#506b80" font-weight="400" >Die Konzepte hinter der Ticketverwaltung – direkt am vorhandenen Code.</text><rect x="32" y="120" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="54" y="142" width="58" height="58" rx="16" fill="#29d7ce" fill-opacity=".08"/><g transform="translate(57 145) scale(0.8125)" fill="none" stroke="#29d7ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#29d7ce"><path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z"/><path d="M40 19v5m0 7v5m0 7v4M22 27h10m-10 9h10"/></g><text x="128" y="179" font-size="27" fill="#10273d" font-weight="700" >Tickets</text><text x="56" y="238" font-size="19" fill="#38546b" font-weight="400" >Ein Objekt, viele Referenzen.</text><text x="56" y="269" font-size="18" fill="#607a8e" font-weight="400" >ID, Kunde, Bearbeiter und Status.</text><rect x="496" y="120" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="518" y="142" width="58" height="58" rx="16" fill="#6a57d5" fill-opacity=".08"/><g transform="translate(521 145) scale(0.8125)" fill="none" stroke="#6a57d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#6a57d5"><rect x="13" y="13" width="38" height="12" rx="4"/><rect x="13" y="29" width="38" height="12" rx="4"/><path d="M16 47h32M22 19h21m-21 16h21"/></g><text x="592" y="179" font-size="27" fill="#10273d" font-weight="700" >Collections</text><text x="520" y="238" font-size="19" fill="#38546b" font-weight="400" >Liste, Map und Set halten Ordnung.</text><text x="520" y="269" font-size="18" fill="#607a8e" font-weight="400" >Bestand, Zuständigkeit und Kunden.</text><rect x="960" y="120" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="982" y="142" width="58" height="58" rx="16" fill="#d78619" fill-opacity=".08"/><g transform="translate(985 145) scale(0.8125)" fill="none" stroke="#d78619" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#d78619"><path d="M17 47V18m-7 7 7-7 7 7M32 22h20M32 34h15M32 46h10"/><circle cx="46" cy="15" r="3" fill="currentColor" stroke="none"/></g><text x="1056" y="179" font-size="27" fill="#10273d" font-weight="700" >Priorität</text><text x="984" y="238" font-size="19" fill="#38546b" font-weight="400" >Dringlichkeit entscheidet zuerst.</text><text x="984" y="269" font-size="18" fill="#607a8e" font-weight="400" >Kleine Prioritätszahl, dann kleine ID.</text><rect x="32" y="339" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="54" y="361" width="58" height="58" rx="16" fill="#6a57d5" fill-opacity=".08"/><g transform="translate(57 364) scale(0.8125)" fill="none" stroke="#6a57d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#6a57d5"><path d="M18 22h21a15 15 0 0 1 0 30H27M18 22l10-10M18 22l10 10"/></g><text x="128" y="398" font-size="27" fill="#10273d" font-weight="700" >Rückgängig</text><text x="56" y="457" font-size="19" fill="#38546b" font-weight="400" >Die letzte Erledigung zuerst.</text><text x="56" y="488" font-size="18" fill="#607a8e" font-weight="400" >Stack und LIFO machen es möglich.</text><rect x="496" y="339" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="518" y="361" width="58" height="58" rx="16" fill="#009c94" fill-opacity=".08"/><g transform="translate(521 364) scale(0.8125)" fill="none" stroke="#009c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#009c94"><path d="M11 18h13l10 14h19M11 46h13l10-14M11 32h14M46 25l7 7-7 7"/><circle cx="11" cy="18" r="3"/><circle cx="11" cy="32" r="3"/><circle cx="11" cy="46" r="3"/></g><text x="592" y="398" font-size="27" fill="#10273d" font-weight="700" >Streams</text><text x="520" y="457" font-size="19" fill="#38546b" font-weight="400" >Filtern. Umwandeln. Sammeln.</text><text x="520" y="488" font-size="18" fill="#607a8e" font-weight="400" >Neue Auswertung, neuer Stream.</text><rect x="960" y="339" width="448" height="200" rx="18" fill="#fff" stroke="#dbe5ed"/><rect x="982" y="361" width="58" height="58" rx="16" fill="#1c78b8" fill-opacity=".08"/><g transform="translate(985 364) scale(0.8125)" fill="none" stroke="#1c78b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#1c78b8"><path d="M13 12v40h41M23 43V30m12 13V22m12 21V14"/><path d="M21 21l12-8 14-5"/></g><text x="1056" y="398" font-size="27" fill="#10273d" font-weight="700" >Auswertung</text><text x="984" y="457" font-size="19" fill="#38546b" font-weight="400" >Aus Tickets werden Antworten.</text><text x="984" y="488" font-size="18" fill="#607a8e" font-weight="400" >Zählen, gruppieren, Mittelwert bilden.</text></g></svg>