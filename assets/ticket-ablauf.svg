<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">Datenfluss eines offenen Tickets</title><desc id="desc">Anlegen mit OFFEN, Prioritätsqueue, Erledigen mit poll und Stack, Undo mit pop. Nach Undo wird das Ticket erneut nach Priorität und ID in die Queue eingeordnet.</desc>
<g font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#41bbb7"/></marker></defs>
<rect width="1440" height="480" rx="24" fill="#0e2336"/>
<text x="46" y="58" font-size="30" fill="#f3f8fb" font-weight="700" >So arbeitet ein offenes Ticket durch das System</text><text x="46" y="91" font-size="18" fill="#a9c1d0" font-weight="400" >Anlegen → priorisieren → erledigen. Die letzte Erledigung lässt sich zurücknehmen.</text><rect x="42" y="128" width="318" height="216" rx="18" fill="#17354a" stroke="#36556b"/><text x="64" y="163" font-size="14" fill="#87a9bc" font-weight="600" >01</text><g transform="translate(274 144) scale(0.8125)" fill="none" stroke="#29d7ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#29d7ce"><path d="M12 17h40v10a6 6 0 0 0 0 12v10H12V39a6 6 0 0 0 0-12V17Z"/><path d="M40 19v5m0 7v5m0 7v4M22 27h10m-10 9h10"/></g><text x="64" y="206" font-size="27" fill="#f2f8fc" font-weight="700" >Anlegen</text><text x="64" y="255" font-size="20" fill="#29d7ce" font-weight="600" >Status: OFFEN</text><text x="64" y="293" font-size="16" fill="#b2cbd9" font-weight="400" >Zur Gesamtliste hinzufügen.</text><rect x="388" y="128" width="318" height="216" rx="18" fill="#17354a" stroke="#36556b"/><text x="410" y="163" font-size="14" fill="#87a9bc" font-weight="600" >02</text><g transform="translate(620 144) scale(0.8125)" fill="none" stroke="#29d7ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#29d7ce"><path d="M17 47V18m-7 7 7-7 7 7M32 22h20M32 34h15M32 46h10"/><circle cx="46" cy="15" r="3" fill="currentColor" stroke="none"/></g><text x="410" y="206" font-size="27" fill="#f2f8fc" font-weight="700" >Einreihen</text><text x="410" y="255" font-size="20" fill="#29d7ce" font-weight="600" >PriorityQueue</text><text x="410" y="293" font-size="16" fill="#b2cbd9" font-weight="400" >Priorität aufsteigend, dann ID.</text><rect x="734" y="128" width="318" height="216" rx="18" fill="#17354a" stroke="#36556b"/><text x="756" y="163" font-size="14" fill="#87a9bc" font-weight="600" >03</text><g transform="translate(966 144) scale(0.8125)" fill="none" stroke="#29d7ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#29d7ce"><rect x="13" y="13" width="38" height="12" rx="4"/><rect x="13" y="29" width="38" height="12" rx="4"/><path d="M16 47h32M22 19h21m-21 16h21"/></g><text x="756" y="206" font-size="27" fill="#f2f8fc" font-weight="700" >Erledigen</text><text x="756" y="255" font-size="20" fill="#29d7ce" font-weight="600" >poll() → ERLEDIGT</text><text x="756" y="293" font-size="16" fill="#b2cbd9" font-weight="400" >Entnehmen und auf Stack legen.</text><rect x="1080" y="128" width="318" height="216" rx="18" fill="#17354a" stroke="#36556b"/><text x="1102" y="163" font-size="14" fill="#87a9bc" font-weight="600" >04</text><g transform="translate(1312 144) scale(0.8125)" fill="none" stroke="#ad9cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#ad9cff"><path d="M18 22h21a15 15 0 0 1 0 30H27M18 22l10-10M18 22l10 10"/></g><text x="1102" y="206" font-size="27" fill="#f2f8fc" font-weight="700" >Rückgängig</text><text x="1102" y="255" font-size="20" fill="#ad9cff" font-weight="600" >pop() → OFFEN</text><text x="1102" y="293" font-size="16" fill="#b2cbd9" font-weight="400" >Letzte Erledigung zurücknehmen.</text><path d="M366 232h14" stroke="#41bbb7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M712 232h14" stroke="#41bbb7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1058 232h14" stroke="#41bbb7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1239 350v48a20 20 0 0 1-20 20H567a20 20 0 0 1-20-20v-44" fill="none" stroke="#41bbb7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="683" y="393" width="445" height="43" rx="20" fill="#0e2336"/><text x="905" y="421" font-size="17" fill="#8fe4dd" font-weight="500" text-anchor="middle">Wieder nach Priorität in die Queue einordnen</text><text x="46" y="459" font-size="16" fill="#9fbccd" font-weight="400" >Nur OFFEN kommt in die Queue. Die Gesamtliste behält alle Tickets und ihre aktuellen Statuswerte.</text></g></svg>